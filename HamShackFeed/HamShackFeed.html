<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HamShackFeed — Ham Radio Content Aggregator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Share+Tech+Mono&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080c14;
  --bg2:       #0d1320;
  --bg3:       #121926;
  --border:    #1e2a3a;
  --border2:   #2a3a50;
  --text:      #c8d8e8;
  --text-dim:  #607080;
  --text-muted:#3a4a5a;
  --accent:    #00b4d8;
  --accent2:   #0077b6;
  --gold:      #d4a843;
  --green:     #39ff14;
  --red:       #ff4560;
  --blog:      #00b4d8;
  --podcast:   #d4a843;
  --youtube:   #ff4560;
  --card-r:    8px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 15px;
  min-height: 100vh;
}

/* ── Scanline texture overlay ── */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background: repeating-linear-gradient(0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

/* ── Header ── */
header {
  position: sticky; top:0; z-index:100;
  background: rgba(8,12,20,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}

.header-inner {
  max-width: 1400px; margin:0 auto;
  display: flex; align-items: center; gap:16px;
  height: 56px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.logo span { color: var(--text-dim); font-weight:400; font-size:13px; margin-left:8px; }

/* Search */
.search-wrap {
  flex: 1; max-width: 480px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px 8px 36px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute; left:10px; top:50%; transform:translateY(-50%);
  color: var(--text-dim); font-size:14px; pointer-events:none;
}

/* Filter tabs */
.filters {
  display: flex; gap:4px; flex-shrink:0;
}

.filter-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; letter-spacing: 1px;
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}

.filter-btn:hover { border-color: var(--border2); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
.filter-btn.blog.active   { background: var(--blog);    border-color: var(--blog);    color:#000; }
.filter-btn.podcast.active{ background: var(--podcast); border-color: var(--podcast); color:#000; }
.filter-btn.youtube.active{ background: var(--youtube); border-color: var(--youtube); color:#fff; }

/* Header actions */
.header-actions { display:flex; gap:8px; margin-left:auto; flex-shrink:0; }

.btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; letter-spacing:1px;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  transition: all 0.2s;
  text-transform: uppercase;
}

.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color:#000; font-weight:600; }
.btn.primary:hover { background: #00d4ff; border-color:#00d4ff; }

/* ── Layout ── */
.layout {
  max-width: 1400px; margin: 0 auto;
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  min-height: calc(100vh - 56px);
  position: relative; z-index:1;
}

/* ── Sidebar ── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}

.sidebar::-webkit-scrollbar { width:4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius:2px; }

.sidebar-section {
  padding: 0 16px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.sidebar-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing:3px; text-transform:uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  padding: 0 4px;
}

.source-item {
  display: flex; align-items: center; gap:8px;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}

.source-item:hover { background: var(--bg3); }
.source-item.selected { background: var(--bg3); }

.source-dot {
  width: 6px; height:6px; border-radius:50%; flex-shrink:0;
}

.source-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--text);
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.source-count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--accent);
  background: rgba(0,180,216,0.1);
  padding: 1px 6px; border-radius:8px;
  flex-shrink:0;
}

.source-remove {
  opacity:0; background:none; border:none;
  color: var(--red); cursor:pointer; font-size:14px;
  padding: 0 2px; transition: opacity 0.15s;
  flex-shrink:0;
}
.source-item:hover .source-remove { opacity:1; }

.unread-toggle {
  display: flex; align-items:center; gap:8px;
  padding: 6px 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--text-dim);
}

.toggle-switch {
  width: 32px; height:18px;
  background: var(--border2);
  border-radius:9px; cursor:pointer;
  position:relative; transition: background 0.2s;
  flex-shrink:0; border:none;
}

.toggle-switch.on { background: var(--accent); }

.toggle-switch::after {
  content:'';
  position:absolute; width:12px; height:12px;
  background:#fff; border-radius:50%;
  top:3px; left:3px;
  transition: transform 0.2s;
}

.toggle-switch.on::after { transform:translateX(14px); }

/* ── Main content ── */
.main { padding: 24px; overflow-y:auto; }

.content-header {
  display: flex; align-items:center; gap:16px;
  margin-bottom: 20px;
}

.content-title {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight:700;
  color: var(--text-dim); letter-spacing:2px; text-transform:uppercase;
}

.content-count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--text-muted);
}

.mark-all-btn {
  margin-left:auto;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing:1px; text-transform:uppercase;
  background: none; border:1px solid var(--border);
  color: var(--text-dim); padding:4px 10px; border-radius:4px;
  cursor:pointer; transition: all 0.2s;
}
.mark-all-btn:hover { border-color:var(--green); color:var(--green); }

/* ── Feed cards ── */
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.feed-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--card-r);
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  position: relative;
}

.feed-card:hover {
  border-color: var(--border2);
  transform: translateY(-1px);
}

.feed-card.read {
  opacity: 0.45;
}

.feed-card.read:hover { opacity:0.7; }

.card-type-bar {
  height: 3px;
  width: 100%;
}

.card-type-bar.blog    { background: var(--blog); }
.card-type-bar.podcast { background: var(--podcast); }
.card-type-bar.youtube { background: var(--youtube); }

.card-body { padding: 14px 16px; }

.card-meta {
  display: flex; align-items:center; gap:8px;
  margin-bottom: 8px;
}

.card-source {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing:1px; text-transform:uppercase;
  color: var(--text-dim);
}

.card-type-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing:1px; text-transform:uppercase;
  padding: 2px 6px; border-radius:2px;
}

.card-type-badge.blog    { color:var(--blog);    background:rgba(0,180,216,0.1); }
.card-type-badge.podcast { color:var(--podcast); background:rgba(212,168,67,0.1); }
.card-type-badge.youtube { color:var(--youtube); background:rgba(255,69,96,0.1); }

.card-date {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-muted);
  margin-left: auto;
}

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 14px; font-weight:600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-desc {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-thumb {
  width: 100%; height:140px;
  object-fit:cover; display:block;
  background: var(--bg3);
}

.card-footer {
  display:flex; align-items:center; gap:8px;
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.card-read-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing:1px; text-transform:uppercase;
  background:none; border:none; cursor:pointer;
  color: var(--text-muted); transition:color 0.2s;
  padding:0;
}
.card-read-btn:hover { color: var(--green); }
.feed-card.read .card-read-btn { color: var(--green); }

.card-open-btn {
  margin-left:auto;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing:1px; text-transform:uppercase;
  background:none; border:1px solid var(--border); border-radius:3px;
  padding:3px 8px; color:var(--text-dim); cursor:pointer;
  transition:all 0.15s; text-decoration:none; display:inline-block;
}
.card-open-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── Loading / Empty states ── */
.loading-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(340px,1fr));
  gap:16px;
}

.skeleton {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--card-r);
  overflow:hidden;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

@keyframes skeleton-pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.5; }
}

.skeleton-bar { height:3px; background:var(--border2); }
.skeleton-body { padding:14px 16px; }
.skeleton-line {
  height:12px; background:var(--border2); border-radius:2px;
  margin-bottom:8px;
}
.skeleton-line.short { width:40%; }
.skeleton-line.medium { width:70%; }

.empty-state {
  text-align:center; padding:80px 40px;
  grid-column: 1/-1;
}

.empty-state .empty-icon {
  font-size:48px; margin-bottom:16px; display:block;
}

.empty-state p {
  font-family: 'Share Tech Mono', monospace;
  font-size:13px; color:var(--text-muted);
}

/* ── Web Search results ── */
.web-search-section {
  margin-top:32px; padding-top:24px;
  border-top: 1px solid var(--border);
}

.web-search-title {
  font-family: 'Syne', sans-serif;
  font-size:11px; letter-spacing:3px; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:16px;
}

/* ── Modal ── */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }

.modal {
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:28px;
  width:480px; max-width:90vw;
}

.modal-title {
  font-family:'Syne',sans-serif;
  font-size:16px; font-weight:700;
  margin-bottom:6px;
}

.modal-sub {
  font-family:'Share Tech Mono',monospace;
  font-size:11px; color:var(--text-muted);
  margin-bottom:20px;
}

.modal label {
  font-family:'Share Tech Mono',monospace;
  font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--text-dim); display:block; margin-bottom:6px;
}

.modal input, .modal select {
  width:100%; background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:4px; padding:10px 12px;
  color:var(--text); font-family:'Share Tech Mono',monospace;
  font-size:13px; outline:none; margin-bottom:16px;
  transition:border-color 0.2s;
}
.modal input:focus, .modal select:focus { border-color:var(--accent); }

.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }

.modal-status {
  font-family:'Share Tech Mono',monospace;
  font-size:11px; color:var(--accent);
  margin-top:8px; min-height:18px;
}

/* ── Notification toast ── */
.toast {
  position:fixed; bottom:24px; right:24px; z-index:300;
  background:var(--bg3); border:1px solid var(--border2);
  border-radius:6px; padding:12px 18px;
  font-family:'Share Tech Mono',monospace; font-size:12px;
  color:var(--text); transform:translateY(80px); opacity:0;
  transition:all 0.3s; pointer-events:none;
}
.toast.show { transform:translateY(0); opacity:1; }

/* ── Responsive ── */
@media (max-width:768px) {
  .layout { grid-template-columns:1fr; }
  .sidebar { display:none; }
  .feed-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">HAMSHACK<span>FEED</span></div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search feed or web..." autocomplete="off">
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn blog" data-filter="blog" onclick="setFilter('blog',this)">Blog</button>
      <button class="filter-btn podcast" data-filter="podcast" onclick="setFilter('podcast',this)">Podcast</button>
      <button class="filter-btn youtube" data-filter="youtube" onclick="setFilter('youtube',this)">Video</button>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="refreshAll()">↺ Refresh</button>
      <button class="btn primary" onclick="openAddModal()">+ Add Source</button>
    </div>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Display</div>
      <div class="unread-toggle">
        <button class="toggle-switch" id="unreadToggle" onclick="toggleUnread()"></button>
        <span id="unreadLabel">Show all</span>
      </div>
    </div>

    <div class="sidebar-section" id="sourceList">
      <div class="sidebar-title">Sources</div>
      <!-- Populated by JS -->
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="content-header">
      <div class="content-title" id="contentTitle">All Sources</div>
      <div class="content-count" id="contentCount"></div>
      <button class="mark-all-btn" onclick="markAllRead()">Mark all read</button>
    </div>

    <div class="feed-grid" id="feedGrid">
      <!-- Loading skeletons -->
    </div>

    <div id="webSearchSection" style="display:none">
      <div class="web-search-section">
        <div class="web-search-title">◈ Web Search Results — DuckDuckGo</div>
        <div class="feed-grid" id="webResultsGrid"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add Source Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">Add Content Source</div>
    <div class="modal-sub">Paste any URL — blog, podcast, or YouTube channel</div>

    <label>URL</label>
    <input type="url" id="addUrl" placeholder="https://www.example.com" />

    <label>Label (optional)</label>
    <input type="text" id="addLabel" placeholder="Auto-detected if left blank" />

    <label>Type</label>
    <select id="addType">
      <option value="auto">Auto-detect</option>
      <option value="blog">Blog / News</option>
      <option value="podcast">Podcast</option>
      <option value="youtube">YouTube Channel</option>
    </select>

    <div class="modal-status" id="addStatus"></div>

    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn primary" onclick="addSource()">Add Source</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Constants ────────────────────────────────────────────
const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';
const YT_RSS    = 'https://www.youtube.com/feeds/videos.xml?channel_id=';
const STORAGE_SOURCES = 'n4mi_sources_v2';
const STORAGE_READ    = 'n4mi_read_v2';

// ── Default sources ──────────────────────────────────────
const DEFAULT_SOURCES = [
  // Blogs
  { id:'dxworld',      name:'DX World',          type:'blog',    url:'https://www.dx-world.net/feed/' },
  { id:'onallbands',   name:'On All Bands',       type:'blog',    url:'https://www.onallbands.com/feed/' },
  { id:'kb6nu',        name:'KB6NU Blog',         type:'blog',    url:'https://www.kb6nu.com/feed/' },
  { id:'dxzone',       name:'DX Zone',            type:'blog',    url:'https://www.dxzone.com/feed/' },
  { id:'dxnews',       name:'DX News',            type:'blog',    url:'https://dxnews.com/feed/' },
  { id:'arnewsline',   name:'AR Newsline',        type:'blog',    url:'https://www.arnewsline.org/feed/' },
  { id:'twiar',        name:'This Week in AR',    type:'blog',    url:'https://twiar.net/feed/' },
  // Podcasts
  { id:'hrcc_pod',     name:'Ham Radio Crash Course (Podcast)', type:'podcast', url:'https://hamradiocrashcourse.podbean.com/feed.xml' },
  { id:'arroundtable', name:'ARRL Roundtable',    type:'podcast', url:'https://arroundtable.podbean.com/feed.xml' },
  { id:'100watts',     name:'100W & A Wire',      type:'podcast', url:'https://feeds.buzzsprout.com/1074116.rss' },
  { id:'hamradio20_pod',name:'Ham Radio 2.0 (Podcast)', type:'podcast', url:'https://www.spreaker.com/show/2042782/episodes/feed' },
  // YouTube
  { id:'hrcc_yt',      name:'Ham Radio Crash Course (YT)', type:'youtube', url: YT_RSS + 'UChAu6Cof9KlfFxSbL9ytosQ' },
  { id:'hrconcepts',   name:'Ham Radio Concepts', type:'youtube', url: YT_RSS + 'UCuawHU2iYR_0tpYAIDyIH4Q' },
  { id:'hamradio20_yt',name:'Ham Radio 2.0 (YT)', type:'youtube', url: YT_RSS + 'UCKpVMjRE0m60lKCBWhIlo0A' },
  { id:'km4ack',       name:'KM4ACK',             type:'youtube', url: YT_RSS + 'UCSQhXfGo_68Ta8-2wStAWkw' },
  { id:'davecasler',   name:'Dave Casler',        type:'youtube', url: YT_RSS + 'UCaBtYooQdmNzq63eID8RaLQ' },
  { id:'hamnation',    name:'Ham Nation',         type:'youtube', url: YT_RSS + 'UCBLgTMpPMkuV-xeEbx1UKZg' },
];

// ── State ────────────────────────────────────────────────
let sources   = [];
let allItems  = [];
let readItems = new Set();
let filter    = 'all';
let showUnreadOnly = false;
let selectedSource = null;
let searchQuery = '';
let searchTimer = null;
let loading = true;

// ── Init ─────────────────────────────────────────────────
function init() {
  // Load sources from localStorage or use defaults
  try {
    const saved = localStorage.getItem(STORAGE_SOURCES);
    sources = saved ? JSON.parse(saved) : [...DEFAULT_SOURCES];
  } catch(e) { sources = [...DEFAULT_SOURCES]; }

  // Load read items
  try {
    const saved = localStorage.getItem(STORAGE_READ);
    readItems = new Set(saved ? JSON.parse(saved) : []);
  } catch(e) { readItems = new Set(); }

  renderSourceList();
  showSkeletons();
  fetchAllFeeds();

  // Search handler
  document.getElementById('searchInput').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    searchQuery = e.target.value.trim();
    searchTimer = setTimeout(function() {
      if (searchQuery.length > 2) {
        renderFeed();
        if (searchQuery.length > 3) webSearch(searchQuery);
      } else {
        renderFeed();
        document.getElementById('webSearchSection').style.display = 'none';
      }
    }, 400);
  });
}

// ── Save state ───────────────────────────────────────────
function saveSources() {
  try { localStorage.setItem(STORAGE_SOURCES, JSON.stringify(sources)); } catch(e) {}
}

function saveRead() {
  try { localStorage.setItem(STORAGE_READ, JSON.stringify([...readItems])); } catch(e) {}
}

// ── Fetch feeds ──────────────────────────────────────────
async function fetchAllFeeds() {
  loading = true;
  showSkeletons();
  allItems = [];

  const promises = sources.map(src => fetchFeed(src));
  await Promise.allSettled(promises);

  // Sort all items by date descending
  allItems.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
  loading = false;
  renderFeed();
  renderSourceList();
}

async function fetchFeed(source) {
  try {
    const proxyUrl = RSS_PROXY + encodeURIComponent(source.url) + '&count=10&api_key=';
    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.status !== 'ok' && data.status !== 'error') throw new Error('Bad response');

    const items = (data.items || []).slice(0, 8).map(function(item) {
      return {
        id:          source.id + '_' + btoa(item.link || item.title || Math.random()).slice(0,12),
        sourceId:    source.id,
        sourceName:  source.name,
        type:        source.type,
        title:       item.title || 'Untitled',
        link:        item.link  || '#',
        description: stripHtml(item.description || item.content || ''),
        pubDate:     item.pubDate || new Date().toISOString(),
        thumbnail:   item.thumbnail || item.enclosure?.link || '',
      };
    });
    allItems.push(...items);
    source.itemCount = items.length;
    source.error = false;
  } catch(e) {
    source.error = true;
    source.itemCount = 0;
    console.warn('Feed error for', source.name, e.message);
  }
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g,' ').trim().slice(0,200);
}

// ── Render ────────────────────────────────────────────────
function renderFeed() {
  const grid = document.getElementById('feedGrid');
  let items = [...allItems];

  // Filter by type
  if (filter !== 'all') items = items.filter(i => i.type === filter);
  // Filter by source
  if (selectedSource) items = items.filter(i => i.sourceId === selectedSource);
  // Filter unread
  if (showUnreadOnly) items = items.filter(i => !readItems.has(i.id));
  // Filter by search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(i =>
      i.title.toLowerCase().includes(q) ||
      i.description.toLowerCase().includes(q) ||
      i.sourceName.toLowerCase().includes(q)
    );
  }

  document.getElementById('contentCount').textContent =
    items.length + ' item' + (items.length !== 1 ? 's' : '');

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state"><span class="empty-icon">📻</span><p>' +
      (loading ? 'Loading feeds...' : 'No items match the current filters.') + '</p></div>';
    return;
  }

  grid.innerHTML = items.map(renderCard).join('');
}

function renderCard(item) {
  const isRead = readItems.has(item.id);
  const date   = formatDate(item.pubDate);
  const thumb  = item.thumbnail
    ? '<img class="card-thumb" src="' + escHtml(item.thumbnail) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
    : '';

  return '<div class="feed-card ' + (isRead ? 'read' : '') + '" id="card_' + escHtml(item.id) + '">' +
    '<div class="card-type-bar ' + item.type + '"></div>' +
    thumb +
    '<div class="card-body">' +
      '<div class="card-meta">' +
        '<span class="card-source">' + escHtml(item.sourceName) + '</span>' +
        '<span class="card-type-badge ' + item.type + '">' + item.type + '</span>' +
        '<span class="card-date">' + date + '</span>' +
      '</div>' +
      '<div class="card-title">' + escHtml(item.title) + '</div>' +
      (item.description ? '<div class="card-desc">' + escHtml(item.description) + '</div>' : '') +
    '</div>' +
    '<div class="card-footer">' +
      '<button class="card-read-btn" onclick="toggleRead(\'' + escHtml(item.id) + '\',event)">' +
        (isRead ? '✓ Read' : '○ Mark read') +
      '</button>' +
      '<a class="card-open-btn" href="' + escHtml(item.link) + '" target="_blank" rel="noopener" onclick="markRead(\'' + escHtml(item.id) + '\')">Open →</a>' +
    '</div>' +
  '</div>';
}

function renderSourceList() {
  const container = document.getElementById('sourceList');
  const types = ['blog','podcast','youtube'];
  const labels = { blog:'Blogs', podcast:'Podcasts', youtube:'Video' };
  const dots   = { blog:'var(--blog)', podcast:'var(--podcast)', youtube:'var(--youtube)' };

  let html = '<div class="sidebar-title">Sources</div>';

  types.forEach(function(type) {
    const typeSources = sources.filter(s => s.type === type);
    if (!typeSources.length) return;
    html += '<div style="margin-bottom:12px">';
    html += '<div style="font-family:\'Share Tech Mono\',monospace;font-size:9px;letter-spacing:2px;color:var(--text-muted);padding:4px 8px;text-transform:uppercase">' + labels[type] + '</div>';
    typeSources.forEach(function(src) {
      const count = src.itemCount || 0;
      const unread = allItems.filter(i => i.sourceId === src.id && !readItems.has(i.id)).length;
      html += '<div class="source-item ' + (selectedSource === src.id ? 'selected' : '') + '" onclick="selectSource(\'' + src.id + '\')">' +
        '<div class="source-dot" style="background:' + dots[type] + ';' + (src.error ? 'opacity:0.3' : '') + '"></div>' +
        '<span class="source-name" title="' + escHtml(src.name) + '">' + escHtml(src.name) + '</span>' +
        (unread > 0 ? '<span class="source-count">' + unread + '</span>' : '') +
        '<button class="source-remove" onclick="removeSource(\'' + src.id + '\',event)" title="Remove source">✕</button>' +
      '</div>';
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

function showSkeletons() {
  const grid = document.getElementById('feedGrid');
  grid.innerHTML = Array(6).fill(0).map(() =>
    '<div class="skeleton">' +
      '<div class="skeleton-bar"></div>' +
      '<div class="skeleton-body">' +
        '<div class="skeleton-line short"></div>' +
        '<div class="skeleton-line medium" style="height:16px"></div>' +
        '<div class="skeleton-line"></div>' +
        '<div class="skeleton-line short"></div>' +
      '</div>' +
    '</div>'
  ).join('');
}

// ── Actions ──────────────────────────────────────────────
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}

function selectSource(id) {
  selectedSource = (selectedSource === id) ? null : id;
  document.getElementById('contentTitle').textContent =
    selectedSource ? sources.find(s => s.id === id)?.name || 'Source' : 'All Sources';
  renderFeed();
  renderSourceList();
}

function toggleUnread() {
  showUnreadOnly = !showUnreadOnly;
  const btn = document.getElementById('unreadToggle');
  btn.className = 'toggle-switch' + (showUnreadOnly ? ' on' : '');
  document.getElementById('unreadLabel').textContent = showUnreadOnly ? 'Unread only' : 'Show all';
  renderFeed();
}

function toggleRead(id, e) {
  e.stopPropagation();
  if (readItems.has(id)) {
    readItems.delete(id);
  } else {
    readItems.add(id);
  }
  saveRead();
  renderFeed();
  renderSourceList();
}

function markRead(id) {
  readItems.add(id);
  saveRead();
  setTimeout(function() { renderFeed(); renderSourceList(); }, 100);
}

function markAllRead() {
  allItems.forEach(function(item) { readItems.add(item.id); });
  saveRead();
  renderFeed();
  renderSourceList();
  showToast('All items marked as read');
}

function refreshAll() {
  showToast('Refreshing all feeds...');
  fetchAllFeeds();
}

// ── Source management ────────────────────────────────────
function removeSource(id, e) {
  e.stopPropagation();
  const src = sources.find(s => s.id === id);
  if (!src) return;
  if (!confirm('Remove "' + src.name + '" from your sources?')) return;
  sources = sources.filter(s => s.id !== id);
  allItems = allItems.filter(i => i.sourceId !== id);
  if (selectedSource === id) selectedSource = null;
  saveSources();
  renderSourceList();
  renderFeed();
  showToast('"' + src.name + '" removed');
}

function openAddModal() {
  document.getElementById('addUrl').value = '';
  document.getElementById('addLabel').value = '';
  document.getElementById('addType').value = 'auto';
  document.getElementById('addStatus').textContent = '';
  document.getElementById('addModal').classList.add('open');
  document.getElementById('addUrl').focus();
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}

async function addSource() {
  const urlVal   = document.getElementById('addUrl').value.trim();
  const labelVal = document.getElementById('addLabel').value.trim();
  const typeVal  = document.getElementById('addType').value;
  const status   = document.getElementById('addStatus');

  if (!urlVal) { status.textContent = 'Please enter a URL'; status.style.color='var(--red)'; return; }

  status.style.color = 'var(--accent)';
  status.textContent = 'Detecting source type...';

  let feedUrl = urlVal;
  let detectedType = typeVal;
  let detectedName = labelVal;

  // Auto-detect YouTube
  if (urlVal.includes('youtube.com') || urlVal.includes('youtu.be')) {
    detectedType = 'youtube';
    // Extract channel ID from URL
    const ytMatch = urlVal.match(/channel\/([a-zA-Z0-9_-]+)/);
    const handleMatch = urlVal.match(/@([a-zA-Z0-9_-]+)/);
    if (ytMatch) {
      feedUrl = YT_RSS + ytMatch[1];
    } else if (handleMatch) {
      // Can't directly convert handle to channel ID without API — use handle
      feedUrl = 'https://www.youtube.com/@' + handleMatch[1];
      status.textContent = 'Note: YouTube handles require a channel ID. Check About page for channel URL.';
    }
    if (!detectedName) detectedName = 'YouTube Channel';
  }
  // Auto-detect podcast platforms
  else if (urlVal.includes('podbean.com')) {
    detectedType = 'podcast';
    feedUrl = urlVal.replace(/\/?$/, '') + '/feed.xml';
    if (!detectedName) detectedName = 'Podcast';
  }
  else if (urlVal.includes('spreaker.com')) {
    detectedType = 'podcast';
    const spMatch = urlVal.match(/podcast\/([^-]+)/);
    if (spMatch) feedUrl = 'https://www.spreaker.com/show/' + spMatch[1] + '/episodes/feed';
    if (!detectedName) detectedName = 'Podcast';
  }
  else if (urlVal.includes('apple.com/podcast')) {
    status.textContent = 'Apple Podcasts: find the original show website for a direct RSS feed.';
    status.style.color = 'var(--gold)';
    return;
  }
  // Blog — try /feed
  else {
    if (detectedType === 'auto') detectedType = 'blog';
    const base = urlVal.replace(/\/+$/, '');
    feedUrl = base + '/feed';
  }

  // Test the feed
  status.textContent = 'Testing feed...';
  try {
    const testUrl = RSS_PROXY + encodeURIComponent(feedUrl) + '&count=3';
    const res = await fetch(testUrl);
    const data = await res.json();

    if (data.status === 'ok' || (data.items && data.items.length > 0)) {
      if (!detectedName && data.feed && data.feed.title) {
        detectedName = data.feed.title;
      }
      if (!detectedName) detectedName = new URL(urlVal).hostname.replace('www.','');

      const id = 'custom_' + Date.now();
      const newSource = { id, name: detectedName, type: detectedType, url: feedUrl };
      sources.push(newSource);
      saveSources();

      status.style.color = 'var(--green)';
      status.textContent = '✓ Added "' + detectedName + '" — fetching items...';

      await fetchFeed(newSource);
      allItems.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
      renderFeed();
      renderSourceList();

      setTimeout(closeAddModal, 1000);
      showToast('"' + detectedName + '" added successfully');
    } else {
      throw new Error('Feed returned no items');
    }
  } catch(e) {
    status.style.color = 'var(--red)';
    status.textContent = 'Could not fetch feed. Try adding /feed or /rss to the URL.';
  }
}

// ── Web search via DuckDuckGo ────────────────────────────
async function webSearch(query) {
  const section = document.getElementById('webSearchSection');
  const grid    = document.getElementById('webResultsGrid');
  section.style.display = 'block';
  grid.innerHTML = '<div style="font-family:\'Share Tech Mono\',monospace;font-size:12px;color:var(--text-muted);grid-column:1/-1">Searching the web...</div>';

  try {
    // Use DuckDuckGo instant answers API
    const url = 'https://api.duckduckgo.com/?q=' +
      encodeURIComponent(query + ' ham radio') +
      '&format=json&no_html=1&skip_disambig=1&no_redirect=1';

    const res = await fetch(url);
    const data = await res.json();

    const results = [];
    if (data.RelatedTopics) {
      data.RelatedTopics.slice(0, 6).forEach(function(t) {
        if (t.FirstURL && t.Text) {
          results.push({ title: t.Text.split(' - ')[0] || t.Text, url: t.FirstURL, desc: t.Text });
        }
      });
    }
    if (data.AbstractText) {
      results.unshift({ title: data.Heading || query, url: data.AbstractURL, desc: data.AbstractText });
    }

    if (results.length === 0) {
      grid.innerHTML = '<div style="font-family:\'Share Tech Mono\',monospace;font-size:12px;color:var(--text-muted);grid-column:1/-1">No web results found. Try a more specific search.</div>';
      return;
    }

    grid.innerHTML = results.map(function(r) {
      return '<div class="feed-card" style="cursor:default">' +
        '<div class="card-type-bar" style="background:var(--gold)"></div>' +
        '<div class="card-body">' +
          '<div class="card-meta">' +
            '<span class="card-source">' + (r.url ? new URL(r.url).hostname : 'Web') + '</span>' +
            '<span class="card-type-badge" style="color:var(--gold);background:rgba(212,168,67,0.1)">Web</span>' +
          '</div>' +
          '<div class="card-title">' + escHtml(r.title) + '</div>' +
          '<div class="card-desc">' + escHtml(r.desc) + '</div>' +
        '</div>' +
        '<div class="card-footer">' +
          '<a class="card-open-btn" href="' + escHtml(r.url) + '" target="_blank" rel="noopener">Visit →</a>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div style="font-family:\'Share Tech Mono\',monospace;font-size:12px;color:var(--text-muted);grid-column:1/-1">Web search unavailable. Check your connection.</div>';
  }
}

// ── Helpers ──────────────────────────────────────────────
function formatDate(str) {
  try {
    const d = new Date(str);
    const now = new Date();
    const diff = now - d;
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7)  return days + 'd ago';
    if (days < 30) return Math.floor(days/7) + 'w ago';
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  } catch(e) { return ''; }
}

function escHtml(s) {
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// Close modal on overlay click
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

// ── Start ────────────────────────────────────────────────
init();
</script>
